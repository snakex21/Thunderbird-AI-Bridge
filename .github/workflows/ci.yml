name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run tests
        run: npm test

      - name: Build XPI
        run: python scripts/build_xpi.py

      - name: Upload XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: thunderbird-ai-bridge-xpi
          path: dist/thunderbird-ai-bridge.xpi
